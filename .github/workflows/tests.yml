# Tests the add-on in Blender 5.3 and builds the extension zip, on every push,
# pull request and once a week. Pushing a version tag (v0.3.80, ...) also publishes
# a GitHub release with the zip: the notes are the tag's message.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Mondays at 06:00 UTC

permissions:
  contents: write   # needed to publish releases

jobs:
  test:
    name: Test and build on Blender 5.3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # download.blender.org refuses some of GitHub's runners (403): find-blender.sh
      # falls back to the official mirrors.
      - name: Find the latest Blender 5.3
        id: build
        run: |
          url=$(bash .github/find-blender.sh 5.3)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "file=$(basename "$url")" >> "$GITHUB_OUTPUT"

      - name: Cache Blender
        uses: actions/cache@v4
        with:
          path: blender.tar.xz
          key: ${{ steps.build.outputs.file }}

      - name: Download Blender
        run: |
          [ -f blender.tar.xz ] || curl -fsSL --retry 3 --retry-all-errors --retry-delay 10 \
            -o blender.tar.xz "${{ steps.build.outputs.url }}"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf blender.tar.xz -C "$RUNNER_TEMP/blender" --strip-components=1

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libxkbcommon0 libsm6 libgl1 libegl1

      - name: Run the tests
        run: |
          "$RUNNER_TEMP/blender/blender" --background --factory-startup \
            --python-exit-code 1 --python tests/run_tests.py

      - name: Build and validate the extension
        run: |
          mkdir -p dist
          "$RUNNER_TEMP/blender/blender" --factory-startup --command extension build \
            --source-dir tissue --output-dir dist
          "$RUNNER_TEMP/blender/blender" --factory-startup --command extension validate dist/*.zip
          unzip -l dist/*.zip

      # Kept for 3 days only: artifacts count against the account's storage, and a
      # full storage must not fail the run.
      - name: Upload the zip
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tissue-extension
          path: dist/*.zip
          retention-days: 3

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' tissue/blender_manifest.toml | cut -d'"' -f2)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "The tag ${GITHUB_REF_NAME} doesn't match version $version in the manifest"; exit 1
          fi
          # checkout only fetches the commit: get the tag itself, whose message
          # becomes the release notes (without it gh uses the commit message)
          git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "Tissue ${version} for Blender 5.3" --notes-from-tag
